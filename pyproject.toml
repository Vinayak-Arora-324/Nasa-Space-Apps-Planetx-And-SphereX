[project]
name = "spherex-sky-viewer"
version = "0.1.0"
description = "Backend for a SPHEREx time-series sky viewer (NASA Space Apps)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "astropy>=6.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
